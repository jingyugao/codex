[package]
edition.workspace = true
license.workspace = true
name = "codex-fork-ext"
version.workspace = true

[lib]
name = "codex_fork_ext"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-core = { workspace = true }
codex-extension-api = { workspace = true }
codex-fork-pg = { path = "../pg" }
codex-protocol = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path-uri = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "signal", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
codex-app-server-protocol = { workspace = true }
codex-queue-extension = { workspace = true }
codex-thread-store = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread"] }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }
